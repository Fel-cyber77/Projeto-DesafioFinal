<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Pedidos</title>
</head>

<body>

    <h1>Sistema Web de Pedidos</h1>

    <h2>Dados do Cliente</h2>

    <label>Nome:</label>
    <input type="text" id="nomeCliente">

    <br><br>

    <label>Idade:</label>
    <input type="number" id="idadeCliente">

    <br><br>

    <label>Cidade:</label>
    <input type="text" id="cidadeCliente">

    <br><br>

    <h2>Dados do Produto</h2>

    <label>Produto:</label>
    <input type="text" id="nomeProduto">

    <br><br>

    <label>Quantidade:</label>
    <input type="number" id="quantidadeProduto">

    <br><br>

    <label>Valor Unitário:</label>
    <input type="number" id="valorUnitario">

    <br><br>

    <button onclick="registrarPedido()">Registrar Pedido</button>

    <script src="script.js"></script>

</body>

</html>
